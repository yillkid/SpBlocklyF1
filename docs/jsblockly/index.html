<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>JS Blockly Editor（之後要串 LLM 的版本）</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #topBar {
      height: 40px;
      background: #1e88e5;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 10px;
      justify-content: space-between;
    }
    #blocklyArea {
      height: calc(100% - 40px);
      width: 100%;
      position: relative;
    }
    #blocklyDiv {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    #output {
      position: absolute;
      right: 0;
      top: 40px;
      width: 250px;
      height: calc(100% - 40px);
      background: #f4f4f4;
      border-left: 1px solid #ccc;
      padding: 10px;
      overflow-y: auto;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="topBar">
    <span>JS Blockly Editor（之後要串 LLM 的版本）</span>
    <button id="runBtn">執行程式</button>
  </div>

  <!-- Blockly Workspace -->
  <div id="blocklyArea">
    <div id="blocklyDiv"></div>
    <div id="output"></div>
  </div>

  <!-- 工具箱 -->
  <xml id="toolbox" style="display:none">
    <category name="文字">
      <block type="text"></block>
    </category>

    <category name="數學">
      <block type="math_number"></block>
    </category>

    <category name="自訂積木" colour="#7e57c2">
      <block type="call_api"></block>
    </category>
  </xml>

  <!-- 1. Blockly 核心 -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>

  <!-- 2. JavaScript generator -->
  <script src="https://unpkg.com/blockly/javascript.min.js"></script>

  <!-- 3. 自訂積木定義（外觀） -->
  <script src="blocks/api_block.js"></script>

  <!-- 4. 自訂積木產生器（JS runtime） -->
  <script src="generators/api_block.js"></script>

  <!-- 5. WorkSpace 初始化（務必放最下面） -->
  <script>
    const blocklyDiv = document.getElementById('blocklyDiv');
    const toolbox = document.getElementById('toolbox');
    const output = document.getElementById('output');

    const workspace = Blockly.inject(blocklyDiv, {
      toolbox: toolbox,
      scrollbars: true
    });

    // 設定 Layout
    function onresize() {
      blocklyDiv.style.height = (window.innerHeight - 40) + 'px';
      Blockly.svgResize(workspace);
    }
    window.addEventListener('resize', onresize, false);
    onresize();

    // 覆寫 console.log → 輸出到右側 Output Pane
    const originLog = console.log;
    console.log = function(...msg) {
      originLog(...msg);
      output.textContent += msg.join(' ') + '\n';
    };

    // 執行程式
    function runCode() {
      output.textContent = "";
      const code = Blockly.JavaScript.workspaceToCode(workspace);
      console.log("--- 產生的程式碼 ---");
      console.log(code);

      try {
        eval(code);
      } catch (e) {
        console.log("錯誤：", e);
      }
    }
    document.getElementById('runBtn').addEventListener('click', runCode);
  </script>
</body>
</html>
